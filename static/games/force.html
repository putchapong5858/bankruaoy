<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สนามแรงผลักแรงดึง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai+Looped:wght@400;600;700&display=swap">
<style>
/* layout: สนามเด็กเล่นกลางแจ้ง — ฟ้าด้านบน หญ้าด้านล่าง เกมอยู่บนกระดานไม้ตรงกลาง */
:root{
  --sky:#cfeaff; --sky2:#e9f6ff; --grass:#7ccf6b; --grass-d:#4f9e45;
  --wood:#fff6e4; --wood-edge:#e3c48e; --ink:#2a2f45; --ink-soft:#5b6380;
  --push:#ff7a3d; --push-soft:#ffe3d4; --pull:#2f7ff0; --pull-soft:#d9e8ff;
  --good:#1fae6a; --bad:#e2463e; --sun:#ffcc33;
  --f-display:"Mali","Noto Sans Thai Looped",sans-serif;
  --f-body:"Noto Sans Thai Looped","Sarabun",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:linear-gradient(var(--sky) 0,var(--sky2) 55%,var(--grass) 55.1%,var(--grass-d) 100%) fixed;
  color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding-block:14px 40px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:clamp(1.4rem,4.5vw,2rem);margin:0;line-height:1.1;text-wrap:balance}
.brand small{display:block;font-size:.85rem;color:var(--ink-soft);font-weight:600}
.sun{width:46px;height:46px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 7px #ffe58a88;flex:0 0 auto}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px;
  font:700 .95rem var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.chip:focus-visible,.btn:focus-visible,.ans:focus-visible,.card:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.board{margin-top:16px;background:var(--wood);border:3px solid var(--wood-edge);border-radius:22px;
  padding:18px clamp(12px,3vw,26px);box-shadow:0 6px 0 var(--wood-edge)}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.game-card{border:3px solid var(--ink);border-radius:18px;background:#fff;padding:14px;cursor:pointer;text-align:left;
  font:inherit;color:inherit;display:grid;grid-template-rows:auto auto 1fr auto;gap:6px;transition:transform .15s}
.game-card:hover{transform:translateY(-3px) rotate(-.5deg)}
.game-card img{width:100%;height:150px;object-fit:contain;background:var(--sky2);border-radius:12px}
.game-card h2{font-family:var(--f-display);margin:4px 0 0;font-size:1.3rem}
.game-card p{margin:0;color:var(--ink-soft);font-size:.95rem}
.tag{justify-self:start;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--sky);color:var(--ink)}
.lead{margin:0 0 14px;font-size:1.02rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.topbar h2{font-family:var(--f-display);margin:0;font-size:1.35rem}
.btn{border:none;border-radius:14px;padding:10px 18px;font:700 1rem var(--f-body);cursor:pointer;background:var(--ink);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.big{font-size:1.25rem;padding:14px 26px}
.stat{font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- เกม 1 ชักเย่อ ---------- */
.arena{position:relative;height:190px;border-radius:16px;overflow:hidden;
  background:linear-gradient(var(--sky2) 0 62%,var(--grass) 62% 100%)}
.arena .mid{position:absolute;left:50%;top:0;bottom:0;border-left:3px dashed #ffffffcc}
.arena .goal{position:absolute;top:58%;width:6px;height:34%;border-radius:3px}
.arena .goal.l{left:14%;background:var(--pull)} .arena .goal.r{right:14%;background:var(--bad)}
.team{position:absolute;z-index:2;bottom:14px;height:150px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.rope-row{position:absolute;left:0;right:0;top:0;bottom:0;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.rope{position:absolute;top:96px;left:-40%;right:-40%;height:8px;background:#8b5a2b;border-radius:4px}
.flag{position:absolute;left:50%;top:96px;width:0;height:0;transform:translateX(-50%);
  border-left:14px solid transparent;border-right:14px solid transparent;border-top:30px solid var(--sun)}
.kidteam{left:3%;transform-origin:bottom center} .bearteam{right:2%;font-size:120px;line-height:150px;transform:scaleX(-1);transform-origin:bottom center}
.kidteam img{height:150px}
.tugbar{display:flex;justify-content:space-between;font-weight:700;margin:6px 2px 10px;font-size:.95rem}
.tugbar .you{color:var(--pull)} .tugbar .bear{color:var(--bad)}
.qcard{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:16px;align-items:center}
.qcard.noimg{grid-template-columns:minmax(0,1fr)}
.qimg{width:100%;max-width:220px;aspect-ratio:1;object-fit:contain;background:#fff;border-radius:14px;border:2px solid var(--wood-edge)}
.qtext{font-family:var(--f-display);font-size:clamp(1.15rem,3.6vw,1.5rem);margin:0 0 12px;text-wrap:balance}
.answers{display:grid;gap:10px}
.answers.two{grid-template-columns:1fr 1fr}
.ans{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:12px 14px;font:700 1.08rem var(--f-body);
  cursor:pointer;color:var(--ink);text-align:left;min-height:56px}
.ans.push{background:var(--push-soft);border-color:var(--push);text-align:center;font-size:1.4rem}
.ans.pull{background:var(--pull-soft);border-color:var(--pull);text-align:center;font-size:1.4rem}
.ans.right{background:#d8f6e6;border-color:var(--good)} .ans.wrong{background:#ffe1df;border-color:var(--bad);animation:shake .35s}
.ans:disabled{cursor:default}
.say{border:none;background:var(--sky);border-radius:50%;width:40px;height:40px;font-size:1.2rem;cursor:pointer;vertical-align:middle;margin-left:6px}
.why{margin-top:10px;font-size:.98rem;padding:8px 12px;border-radius:12px;background:#fff;border-left:6px solid var(--good)}
.why.bad{border-left-color:var(--bad)}
@media (max-width:560px){.qcard{grid-template-columns:1fr}.qimg{max-width:170px;justify-self:center}
  .arena{height:160px}.team{height:120px}.kidteam img{height:120px}.bearteam{font-size:96px;line-height:120px}.rope,.flag{top:76px}}

/* ---------- เกม 2 ผลักกล่อง ---------- */
.lvl-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{font-weight:700;font-size:.9rem;padding:3px 12px;border-radius:999px;background:#fff;border:2px solid var(--wood-edge)}
.track{position:relative;height:210px;border-radius:16px;overflow:hidden;background:var(--sky2)}
.floor{position:absolute;left:0;right:0;bottom:0;height:46px}
.floor.ice{background:repeating-linear-gradient(115deg,#bfe9ff 0 30px,#e6f7ff 30px 44px)}
.floor.tile{background:repeating-linear-gradient(90deg,#e8e4dc 0 58px,#cfc8bb 58px 61px)}
.floor.carpet{background:repeating-linear-gradient(90deg,#e76f51 0 6px,#f08a6d 6px 12px)}
.floor.sand{background:radial-gradient(#c9a66b 1.5px,transparent 2px) 0 0/10px 10px,#ecd29b}
.wall{position:absolute;right:0;bottom:46px;width:14px;height:120px;background:#8d99ae;border-radius:4px 0 0 4px}
.zone{position:absolute;bottom:46px;height:150px;background:repeating-linear-gradient(45deg,#1fae6a33 0 10px,#1fae6a55 10px 20px);
  border-left:3px dashed var(--good);border-right:3px dashed var(--good)}
.zone span{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-weight:700;color:var(--good);white-space:nowrap;font-size:.9rem}
.box{position:absolute;bottom:46px;width:13%;max-width:96px;aspect-ratio:1;border-radius:8px;
  background:repeating-linear-gradient(0deg,#b7793b 0 22%,#9c6630 22% 25%);border:4px solid #7a4b1f;display:grid;place-items:center;font-size:1.6rem}
.box.heavy::after{content:"📚";}
.pusher{position:absolute;bottom:40px;height:150px;transition:transform .2s}
@media (max-width:560px){.pusher{height:100px}.track{height:170px}.zone{height:110px}}
.meter-row{display:flex;gap:14px;align-items:center;margin-top:12px;flex-wrap:wrap}
.meter{flex:1 1 220px;height:30px;border-radius:15px;background:#fff;border:3px solid var(--ink);overflow:hidden;position:relative}
.meter i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffd166,var(--push),#d62828)}
.meter b{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem;color:var(--ink)}
.holdbtn{background:var(--push);color:#fff;border:none;border-radius:20px;font:700 1.3rem var(--f-display);padding:14px 26px;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 5px 0 #c9541f}
.holdbtn:active,.holdbtn.on{transform:translateY(3px);box-shadow:0 2px 0 #c9541f}
.holdbtn:disabled{opacity:.5}
.fact{margin-top:10px;padding:10px 14px;border-radius:12px;background:#fff;border-left:6px solid var(--pull)}

/* ---------- เกม 3 แยกใส่ตะกร้า ---------- */
.sort-area{position:relative;display:grid;grid-template-columns:1fr minmax(0,1.2fr) 1fr;gap:10px;align-items:end;min-height:300px}
.basket{border:4px dashed;border-radius:22px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  padding:10px;gap:4px;font-family:var(--f-display);font-size:1.4rem;cursor:pointer;background:#fff;transition:transform .15s,background .15s}
.basket .ico{font-size:2.6rem;line-height:1}
.basket small{font-family:var(--f-body);font-size:.8rem;color:var(--ink-soft);text-align:center}
.basket.push{border-color:var(--push);color:var(--push)} .basket.pull{border-color:var(--pull);color:var(--pull)}
.basket.hot{transform:scale(1.05)} .basket.push.hot{background:var(--push-soft)} .basket.pull.hot{background:var(--pull-soft)}
.basket .count{font-family:var(--f-body);font-weight:700;font-size:1rem;color:var(--ink)}
.stage{display:flex;justify-content:center;align-items:center;min-height:260px}
.card{width:min(220px,100%);background:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px;text-align:center;touch-action:none;
  cursor:grab;user-select:none;-webkit-user-select:none;box-shadow:0 6px 0 #0002;position:relative;z-index:2}
.card.drag{cursor:grabbing;box-shadow:0 14px 24px #0003}
.card img{width:100%;aspect-ratio:1;object-fit:contain;pointer-events:none}
.card .ctext{font-weight:700;font-size:1.05rem;padding:6px 4px}
.card.textonly{min-height:180px;display:grid;place-items:center;font-size:1.2rem;background:var(--sky2)}
.card.fly{transition:transform .35s ease-in,opacity .35s}
.timer{height:10px;border-radius:5px;background:#fff;border:2px solid var(--ink);overflow:hidden;margin:6px 0 10px}
.timer i{display:block;height:100%;background:var(--good);transition:width .25s linear}
@media (max-width:560px){.sort-area{grid-template-columns:1fr 1fr}.stage{grid-column:1/-1;grid-row:1;min-height:220px}
  .basket{min-height:120px}.card{width:min(190px,100%)}}

/* ---------- จบเกม ---------- */
.end{text-align:center;padding:16px 4px}
.end h3{font-family:var(--f-display);font-size:clamp(1.6rem,6vw,2.4rem);margin:4px 0}
.stars{font-size:2.6rem;letter-spacing:6px}
.review{text-align:left;max-width:560px;margin:10px auto;display:grid;gap:6px}
.review div{background:#fff;border-radius:10px;padding:6px 10px;border-left:5px solid var(--bad);font-size:.95rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .3s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{margin-top:14px;font-size:.85rem;color:#ffffff;text-align:center;text-shadow:0 1px 2px #0005}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="sun" aria-hidden="true"></div>
      <div><h1>สนามแรงผลักแรงดึง</h1><small>เกมวิทยาศาสตร์ · บ้านครูอ้อย</small></div></div>
    <div class="ctrls" role="group" aria-label="เลือกระดับชั้น">
      <a class="chip" href="/portal#games" style="text-decoration:none">← กลับ</a>
      <button class="chip" id="lvK3" aria-pressed="true">อนุบาล 3</button>
      <button class="chip" id="lvP1" aria-pressed="false">ป.1</button>
      <button class="chip" id="sndBtn" aria-pressed="true">🔊 เสียง</button>
    </div>
  </header>
  <main class="board" id="screen"></main>
  <footer>วาดภาพเองทั้งหมด · เนื้อหาจากบทที่ 6 แรงและการเคลื่อนที่</footer>
</div>
<canvas class="confetti" id="confetti"></canvas>

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let actx = null;
function tone(freqs, dur = .12, type = "sine", vol = .18) {
  if (!SOUND) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of freqs) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * .8;
    }
  } catch (e) {}
}
const sGood = () => tone([660, 880, 1175], .11, "triangle");
const sBad = () => tone([300, 220], .16, "square", .08);
const sWin = () => tone([523, 659, 784, 1046, 1318], .13, "triangle");
const sThud = () => tone([110, 80], .12, "sine", .3);
let thVoice = null;
function pickVoice() { try { thVoice = speechSynthesis.getVoices().find(v => /th/i.test(v.lang)) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(text) {
  if (!SOUND || !("speechSynthesis" in window)) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "th-TH"; u.rate = .9; if (thVoice) u.voice = thVoice; speechSynthesis.speak(u); } catch (e) {}
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ff7a3d", "#2f7ff0", "#ffcc33", "#1fae6a", "#e2463e"];
  const ps = Array.from({ length: 120 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, v: 2 + Math.random() * 3, r: Math.random() * 6.28, s: 6 + Math.random() * 6, c: cols[Math.floor(Math.random() * 5)] }));
  let n = 0;
  (function f() { x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.y += p.v; p.r += .1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++n < 160) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}

// ===================== เกม 1 ชักเย่อ =====================
function tug() {
  clearTimers();
  const k3 = LEVEL === "K3", WIN = 4;
  let pos = 0, idx = 0, wrongs = 0, review = [], busy = false;
  let qs;
  if (k3) qs = shuffle(PUSHPULL).slice(0, 12).map(([img, ans, act, why]) => ({ img, q: `${act} ผลัก หรือ ดึง`, ans, why, pp: true }));
  else {
    const pp = shuffle(PUSHPULL).slice(0, 6).map(([img, ans, act, why]) => ({ img, q: `ภาพนี้ "${act}" ใช้แรงอะไร`, ans, why, pp: true }));
    const ef = shuffle(P1_EFFECT).map(e => ({ img: e.img, q: e.q, ans: e.a, opts: shuffle([e.a, ...e.o]), why: e.why }));
    qs = shuffle([...pp, ...ef]);
  }
  const ropeRow = h("div", { class: "rope-row" }, h("div", { class: "rope" }), h("div", { class: "flag" }));
  const kidT = h("div", { class: "team kidteam" }, h("img", { src: IMG.sp_kid_pull, alt: "ทีมหนู" }));
  const bearT = h("div", { class: "team bearteam", role: "img", "aria-label": "เจ้าหมี" }, "🐻");
  const arena = h("div", { class: "arena" }, h("div", { class: "mid" }), h("div", { class: "goal l" }), h("div", { class: "goal r" }), ropeRow, kidT, bearT);
  const status = h("span", { class: "stat" });
  const qbox = h("div", {});
  screen.replaceChildren(topbar("ชักเย่อตอบไว", status),
    h("div", { class: "tugbar" }, h("span", { class: "you" }, "◀ ทีมหนู"), h("span", { class: "bear" }, "เจ้าหมี ▶")), arena, h("div", { style: "height:14px" }), qbox);
  function move(d) {
    pos = Math.max(-WIN, Math.min(WIN, pos + d));
    ropeRow.style.transform = `translateX(${pos * 9}%)`;
    kidT.style.transform = `translateX(${pos * 1.5}%) rotate(${pos < 0 ? -4 : 3}deg)`;
    bearT.style.transform = `scaleX(-1) translateX(${-pos * 1.5}%) rotate(${pos > 0 ? -6 : 3}deg)`;
    sThud();
    if (pos <= -WIN) return finish(true);
    if (pos >= WIN) return finish(false);
  }
  function finish(win) {
    clearTimers();
    const stars = !win ? 0 : wrongs === 0 ? 3 : wrongs <= 2 ? 2 : 1;
    setTimeout(() => endScreen(win ? "ทีมหนูชนะ เก่งมาก!" : "เจ้าหมีชนะรอบนี้", win ? stars : 1,
      win ? `ตอบผิด ${wrongs} ครั้ง` : "ลองใหม่อีกครั้งนะ ตอบให้ถูกแล้วทีมหนูจะดึงเชือกได้", tug, review.slice(0, 5)), 500);
  }
  if (!k3) timers.push(setInterval(() => { if (!busy) move(1); }, 11000));
  function next() {
    if (idx >= qs.length) { qs = shuffle(qs); idx = 0; }
    const q = qs[idx++]; busy = false;
    status.textContent = `เชือก ${pos <= 0 ? "ฝั่งหนู" : "ฝั่งหมี"} ${Math.abs(pos)}/${WIN}`;
    const opts = q.pp ? [["push", k3 ? "🫸 ผลัก" : "🫸 แรงผลัก"], ["pull", k3 ? "✊ ดึง" : "✊ แรงดึง"]] : q.opts.map(o => [o, o]);
    const buttons = opts.map(([v, lab]) => h("button", { class: "ans" + (q.pp ? " " + v : ""), onclick: e => answer(v, e.currentTarget) }, lab));
    const why = h("div", { hidden: true });

      h("div", {}, h("p", { class: "qtext" }, q.q, sayBtn(q.q)), h("div", { class: "answers" + (q.pp ? " two" : "") }, buttons), why)));
    say(q.q);
    function answer(v, btn) {
      if (busy) return; busy = true;
      buttons.forEach(b => b.disabled = true);
      const ok = v === q.ans;
      btn.classList.add(ok ? "right" : "wrong");
      if (!ok) { wrongs++; review.push(`${q.q} → ${q.pp ? (q.ans === "push" ? "แรงผลัก" : "แรงดึง") : q.ans}`);
        buttons.forEach((b, i) => { if (opts[i][0] === q.ans) b.classList.add("right"); }); }
      why.hidden = false; why.className = "why" + (ok ? "" : " bad"); why.textContent = (ok ? "ถูกต้อง! " : "ยังไม่ถูก ") + q.why;
      ok ? sGood() : sBad();
      if (k3) say(ok ? "เก่งมาก" : q.why);
      const done = move(ok ? -1 : 1);
      if (Math.abs(pos) < WIN) timers.push(setTimeout(next, ok ? 1500 : 2600));
    }
  }
  next();
}

// ===================== เกม 2 ผลักกล่อง =====================
const SURF = { ice: ["พื้นน้ำแข็ง", .1], tile: ["พื้นกระเบื้อง", .3], carpet: ["พื้นพรม", .6], sand: ["พื้นทราย", .9] };
const LEVELS = {
  K3: [{ s: "tile", m: 1, z: [.42, .66] }, { s: "carpet", m: 1, z: [.5, .74] }, { s: "tile", m: 1.6, z: [.36, .62] }],
  P1: [{ s: "tile", m: 1, z: [.55, .7] }, { s: "ice", m: 1, z: [.6, .74] }, { s: "carpet", m: 1.6, z: [.45, .6] }, { s: "sand", m: 1, z: [.5, .64] }, { s: "sand", m: 1.6, z: [.58, .72] }],
};
const FACTS = {
  ice: "พื้นน้ำแข็งลื่นมาก มีแรงต้านน้อย ออกแรงนิดเดียวกล่องก็ไถลไปไกล",
  tile: "พื้นกระเบื้องเรียบ กล่องเลื่อนได้ง่าย",
  carpet: "พื้นพรมฝืดกว่ากระเบื้อง ต้องออกแรงมากขึ้น",
  sand: "พื้นทรายฝืดที่สุด กล่องหยุดเร็ว ต้องออกแรงมากที่สุด",
};
function pushGame() {
  clearTimers();
  const k3 = LEVEL === "K3", L = LEVELS[LEVEL];
  let li = 0, tries = 0, totalTries = 0;
  const run = () => {
    clearTimers();
    const lv = L[li], [sname, mu] = SURF[lv.s];
    const dmax = .6 * Math.pow(1.44 / (mu * lv.m), .35);      // ระยะไกลสุดเมื่อออกแรงเต็ม (สัดส่วนของราง)
    const startX = .2, boxW = .13, endX = 1 - .02 - boxW;   // ตำแหน่งซ้ายของกล่อง
    const zone = h("div", { class: "zone", style: `left:${lv.z[0] * 100}%;width:${(lv.z[1] - lv.z[0]) * 100}%` }, h("span", {}, "บ้านของกล่อง"));
    const box = h("div", { class: "box" + (lv.m > 1 ? " heavy" : ""), style: `left:${startX * 100}%` });
    const kidImg = h("img", { class: "pusher", src: IMG.sp_kid_push, alt: "เด็กผลักกล่อง", style: `left:calc(${startX * 100}% - 92px)` });
    const placeKid = () => { if (kidImg.offsetWidth) kidImg.style.left = `calc(${startX * 100}% - ${kidImg.offsetWidth - 8}px)`; };
    kidImg.addEventListener("load", placeKid); setTimeout(placeKid, 50);
    const fill = h("i"), meterLabel = h("b", {}, "กดค้างที่ปุ่ม แล้วปล่อย");
    const btn = h("button", { class: "holdbtn" }, "🫸 กดค้าง = ออกแรง");
    const fact = h("div", { class: "fact", hidden: true });
    const info = h("div", { class: "lvl-head" }, h("span", { class: "pill" }, `ด่าน ${li + 1}/${L.length}`), h("span", { class: "pill" }, sname),
      h("span", { class: "pill" }, lv.m > 1 ? "กล่องใส่หนังสือ (หนัก)" : "กล่องเปล่า (เบา)"));
    screen.replaceChildren(topbar("ผลักกล่องเข้าบ้าน"), info,
      h("div", { class: "track" }, h("div", { class: "floor " + lv.s }), h("div", { class: "wall" }), zone, kidImg, box),
      h("div", { class: "meter-row" }, h("div", { class: "meter", "aria-hidden": "true" }, fill, meterLabel), btn), fact);
    const hint = k3 ? "กดปุ่มค้างไว้ แรงจะเพิ่มขึ้น แล้วปล่อยมือ ให้กล่องไปหยุดในช่องสีเขียว" : `${sname} ${lv.m > 1 ? "กล่องหนัก" : "กล่องเบา"} คิดก่อนว่าต้องใช้แรงมากหรือน้อย`;
    say(hint);
    let holding = false, power = 0, dir = 1, t0 = 0, raf = 0, locked = false;
    const period = k3 ? 2600 : 1900;
    function tick(t) {
      if (!holding) return;
      const ph = ((t - t0) % period) / period;
      power = ph < .5 ? ph * 2 : 2 - ph * 2;           // ขึ้นแล้วลง ไม่ค้างที่เต็ม
      fill.style.width = (power * 100).toFixed(1) + "%";
      meterLabel.textContent = `แรง ${Math.round(power * 100)}%`;
      raf = requestAnimationFrame(tick); timers.push(raf);
    }
    const down = e => { if (locked) return; e.preventDefault(); holding = true; btn.classList.add("on"); t0 = performance.now(); raf = requestAnimationFrame(tick); timers.push(raf); try { btn.setPointerCapture(e.pointerId); } catch (_) {} tone([400], .04); };
    const up = () => { if (!holding) return; holding = false; btn.classList.remove("on"); release(power); };
    btn.addEventListener("pointerdown", down); btn.addEventListener("pointerup", up); btn.addEventListener("pointercancel", up);
    btn.addEventListener("keydown", e => { if ((e.key === " " || e.key === "Enter") && !holding && !e.repeat) down(e); });
    btn.addEventListener("keyup", e => { if (e.key === " " || e.key === "Enter") up(); });
    function release(p) {
      locked = true; btn.disabled = true; tries++; totalTries++;
      kidImg.style.transform = "translateX(18px)"; setTimeout(() => kidImg.style.transform = "", 220);
      let target = startX + p * dmax, hitWall = false;
      if (target > endX) { target = endX; hitWall = true; }
      const dur = 400 + (target - startX) * 1800;
      const t1 = performance.now();
      tone([180 + p * 300], .2, "sawtooth", .06);
      (function anim(t) {
        const k = Math.min(1, (t - t1) / dur), e = 1 - Math.pow(1 - k, 2.2);
        box.style.left = ((startX + (target - startX) * e) * 100) + "%";
        if (k < 1) { const r = requestAnimationFrame(anim); timers.push(r); return; }
        const L0 = target, R0 = target + boxW, mid = (L0 + R0) / 2;
        const inZone = mid >= lv.z[0] && mid <= lv.z[1];
        if (hitWall) sThud();
        if (inZone) {
          sGood(); confetti();
          fact.hidden = false; fact.textContent = "เข้าบ้านพอดี! " + FACTS[lv.s] + (lv.m > 1 ? " และกล่องหนักต้องใช้แรงมากกว่ากล่องเบา" : "");
          say("เข้าบ้านพอดี เก่งมาก");
          setTimeout(() => {
            if (li + 1 < L.length) { li++; tries = 0; fact.append(" ", h("button", { class: "btn", onclick: run }, "ด่านต่อไป →")); }
            else {
              const per = totalTries / L.length;
              endScreen("ผลักกล่องเข้าบ้านครบทุกด่าน!", per <= 1.5 ? 3 : per <= 2.5 ? 2 : 1, `ใช้ทั้งหมด ${totalTries} ครั้ง จาก ${L.length} ด่าน`, pushGame);
            }
          }, 900);
        } else {
          sBad();
          const less = mid > lv.z[1];
          fact.hidden = false;
          fact.textContent = (hitWall ? "โอ๊ะ ชนกำแพง! " : less ? "ไปไกลเกินไป " : "ยังไม่ถึงบ้าน ") +
            (less || hitWall ? "ลองออกแรงให้น้อยลงนะ" : "ลองออกแรงให้มากขึ้นนะ") + (tries >= 3 ? " · " + FACTS[lv.s] : "");
          say(less || hitWall ? "ออกแรงน้อยลงหน่อย" : "ออกแรงมากขึ้นอีกนิด");
          setTimeout(() => { box.style.left = startX * 100 + "%"; btn.disabled = false; locked = false; fill.style.width = "0"; meterLabel.textContent = "ลองอีกครั้ง"; }, 1300);
        }
      })(t1);
    }
  };
  run();
}

// ===================== เกม 3 แยกใส่ตะกร้า =====================
function sortGame() {
  clearTimers();
  const k3 = LEVEL === "K3";
  let deck = k3 ? shuffle(PUSHPULL).slice(0, 8).map(([img, a, act]) => ({ img, a, t: act }))
                : shuffle([...shuffle(PUSHPULL).slice(0, 8).map(([img, a, act]) => ({ img, a, t: act })), ...shuffle(SORT_TEXT_P1).slice(0, 6).map(([t, a]) => ({ t, a }))]);
  const TOTAL = 75; let left = TOTAL, score = 0, combo = 0, best = 0, wrong = [], i = 0, counts = { push: 0, pull: 0 };
  const status = h("span", { class: "stat" });
  const bar = h("i", { style: "width:100%" });
  const mk = (cls, ico, name, sub) => h("div", { class: "basket " + cls, role: "button", tabindex: "0", "aria-label": "ใส่ตะกร้า" + name, onclick: () => drop(cls), onkeydown: e => { if (e.key === "Enter" || e.key === " ") drop(cls); } },
    h("span", { class: "ico" }, ico), name, h("small", {}, sub), h("span", { class: "count" }, "0"));
  const bPush = mk("push", "🫸", "ผลัก", "ของเคลื่อนที่ออกจากตัว"), bPull = mk("pull", "✊", "ดึง", "ของเคลื่อนที่เข้าหาตัว");
  const stage = h("div", { class: "stage" });
  screen.replaceChildren(topbar("แยกใส่ตะกร้า", status), k3 ? null : h("div", { class: "timer" }, bar),
    h("p", { class: "lead", style: "margin:0 0 8px" }, k3 ? "ลากภาพไปใส่ตะกร้า หรือแตะที่ตะกร้าก็ได้" : "ลากหรือแตะตะกร้าให้ไว ถูกติดกันได้คอมโบ"),
    h("div", { class: "sort-area" }, bPush, stage, bPull));
  if (!k3) timers.push(setInterval(() => { left--; bar.style.width = (left / TOTAL * 100) + "%"; if (left <= 10) bar.style.background = "var(--bad)"; if (left <= 0) end(); }, 1000));
  let card = null, cur = null;
  function upd() { status.textContent = k3 ? `${i}/${deck.length}` : `คะแนน ${score} · คอมโบ ${combo}`; }
  function show() {
    upd();
    if (i >= deck.length) return end();
    cur = deck[i];
    card = cur.img ? h("div", { class: "card pop", tabindex: "0" }, h("img", { src: IMG[cur.img], alt: cur.t }), h("div", { class: "ctext" }, cur.t))
                   : h("div", { class: "card textonly pop", tabindex: "0" }, h("div", { class: "ctext" }, cur.t));
    stage.replaceChildren(card);
    say(cur.t);
    let sx = 0, sy = 0, dragging = false;
    card.addEventListener("pointerdown", e => { dragging = true; sx = e.clientX; sy = e.clientY; card.classList.add("drag"); try { card.setPointerCapture(e.pointerId); } catch (_) {} });
    card.addEventListener("pointermove", e => {
      if (!dragging) return; const dx = e.clientX - sx, dy = e.clientY - sy;
      card.style.transform = `translate(${dx}px,${dy}px) rotate(${dx / 20}deg)`;
      bPush.classList.toggle("hot", over(bPush, e)); bPull.classList.toggle("hot", over(bPull, e));
    });
    const finishDrag = e => {
      if (!dragging) return; dragging = false; card.classList.remove("drag"); bPush.classList.remove("hot"); bPull.classList.remove("hot");
      if (over(bPush, e)) drop("push"); else if (over(bPull, e)) drop("pull"); else card.style.transform = "";
    };
    card.addEventListener("pointerup", finishDrag); card.addEventListener("pointercancel", finishDrag);
  }
  function over(el, e) { const r = el.getBoundingClientRect(); return e.clientX >= r.left - 10 && e.clientX <= r.right + 10 && e.clientY >= r.top - 10 && e.clientY <= r.bottom + 10; }

    else { combo = 0; wrong.push(`${cur.t} → ${cur.a === "push" ? "ผลัก" : "ดึง"}`); sBad(); }
    if (k3) say(ok ? "ถูกต้อง" : cur.a === "push" ? "อันนี้คือ ผลัก" : "อันนี้คือ ดึง");
    const r1 = card.getBoundingClientRect(), r2 = basket.getBoundingClientRect();
    card.classList.add("fly");
    card.style.transform = ok ? `translate(${r2.left + r2.width / 2 - r1.left - r1.width / 2}px,${r2.top + r2.height / 2 - r1.top - r1.height / 2}px) scale(.25)` : "translateX(0)";
    if (!ok) { card.style.animation = "shake .35s"; card.style.borderColor = "var(--bad)"; }
    else card.style.opacity = ".2";
    setTimeout(() => {
      if (!ok && !k3) deck.push(cur);   // ป.1 ผิดแล้ววนกลับมาให้ตอบอีก
      if (!ok && k3) { busy = false; card.style.animation = ""; card.style.transform = ""; card.classList.remove("fly"); card.style.borderColor = ""; return; }
      i++; busy = false; show();
    }, ok ? 450 : 900);
  }
  function end() {
    clearTimers();
    const n = k3 ? deck.length : i;
    const stars = k3 ? (wrong.length === 0 ? 3 : wrong.length <= 2 ? 2 : 1) : (score >= 150 ? 3 : score >= 90 ? 2 : 1);
    endScreen(k3 ? "แยกครบแล้ว เก่งมาก!" : `ได้ ${score} คะแนน`, stars,
      k3 ? `ใส่ตะกร้าผลัก ${counts.push} ใบ ตะกร้าดึง ${counts.pull} ใบ` : `แยกถูก ${counts.push + counts.pull} ใบ · คอมโบสูงสุด ${best}`, sortGame, [...new Set(wrong)].slice(0, 5));
  }
  show();
}
